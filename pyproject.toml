[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    "backend/api/migrations",
    "staticfiles",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.coverage.run]
source = ["backend/api"]
omit = [
    "backend/api/migrations/*",
    "backend/api/tests.py",
    "backend/api/admin.py",
    "backend/api/apps.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

