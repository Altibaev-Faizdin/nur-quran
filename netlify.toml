[build]
  publish = "frontend"

[[redirects]]
  from = "/api/*"
  to = "https://nur-quran.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://nur-quran.onrender.com/admin/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/static/*"
  to = "https://nur-quran.onrender.com/static/:splat"
  status = 200
  force = true

# ── Old Reciter Pages Redirects to Unified Template ──
