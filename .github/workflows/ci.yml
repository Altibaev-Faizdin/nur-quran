name: Noor Al-Quran CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-qa:
    name: Django DRF Quality, Security & Coverage
    runs-on: ubuntu-latest
    env:
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,nur-quran.onrender.com"
      CORS_ALLOWED_ORIGINS: "http://127.0.0.1:3415,https://noor-al-quran.netlify.app"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff coverage

      - name: Ruff Lint & Format Check
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Django Migrations & Deploy Security Check
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(52))')"
          python backend/manage.py makemigrations --check --dry-run
          python backend/manage.py check --deploy

      - name: Run Django Tests & Enforce Coverage >= 85%
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(52))')"
          PYTHONPATH=backend coverage run backend/manage.py test api
          coverage report --fail-under=85 -m

  frontend-and-e2e:
    name: Frontend QA, Security & Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Python & Node Dependencies
        run: |
          pip install -r backend/requirements.txt
          npm ci

      - name: Lint, Format, Math & Static Checks
        run: |
          npm run lint
          npm run format:check
          npm test

      - name: Install Playwright Chromium & Run E2E against Django
        run: |
          npx playwright install chromium
          npm run test:e2e

      - name: Verify Repository Tree Size (< 20 MB)
        run: |
          SIZE_KB=$(du -sk --exclude=.git --exclude=node_modules --exclude=.venv . | cut -f1)
          echo "Workspace size: ${SIZE_KB} KB"
          [ "$SIZE_KB" -lt 20480 ]
