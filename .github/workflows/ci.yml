name: Noor Al-Quran CI

on:
  push:
    branches: [ main, master, prod-hardening ]
  pull_request:
    branches: [ main, master, prod-hardening ]

jobs:
  backend-qa:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "False"
      SECRET_KEY: "k9#mP$7vL@2wQ!8zR*5yB&3xT^1uN(4cE)6jA_0sD-9fG+8hJ=7kL[5mN]3bV{1x"
      ALLOWED_HOSTS: "localhost,127.0.0.1,noor-al-quran.netlify.app"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,https://noor-al-quran.netlify.app"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ruff Code Quality & Formatting
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Django Deployment Security Verification
        run: |
          python backend/manage.py check --deploy

      - name: Run Test Suite with Coverage (>= 90%)
        run: |
          coverage run backend/manage.py test api
          coverage report --fail-under=90 -m

  frontend-qa:
    name: Frontend Quality & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Automated Frontend Test Runner
        run: |
          node scripts/test-runner.mjs

      - name: Security & Hardening Verification
        run: |
          node scripts/verify-security.mjs

      - name: Audio Endpoints & Availability Verification
        run: |
          node scripts/verify-audio.mjs
