<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Register — Noor Al-Quran</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lato:wght@300;400;700&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared.css?v=5">
  <style>
    .auth-container { max-width: 400px; margin: 60px auto; padding: 30px 20px; text-align: center; }
    .auth-title { font-family: 'Cinzel Decorative', serif; font-size: 2.2rem; color: var(--goldL); margin-bottom: 10px; }
    .auth-sub { font-size: 0.9rem; color: var(--soft); margin-bottom: 30px; }
    .auth-form { display: flex; flex-direction: column; gap: 15px; }
    .auth-input { width: 100%; background: rgba(13,38,128,0.3); border: 1px solid rgba(212,160,23,0.3); color: var(--white); padding: 14px 18px; border-radius: 25px; font-size: 1rem; outline: none; font-family: 'Lato', sans-serif; transition: var(--r); }
    .auth-input:focus { border-color: var(--gold); box-shadow: 0 0 12px rgba(212,160,23,0.3); }
    .auth-input::placeholder { color: rgba(168,192,232,0.5); }
    .auth-btn { width: 100%; background: linear-gradient(135deg, var(--gold), var(--goldL)); border: none; color: var(--bg0); padding: 15px; border-radius: 25px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: var(--r); box-shadow: 0 4px 15px rgba(212,160,23,0.3); margin-top: 10px; }
    .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212,160,23,0.5); }
    .auth-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .auth-links { margin-top: 25px; font-size: 0.9rem; color: var(--silver); }
    .auth-links a { color: var(--goldL); text-decoration: none; font-weight: bold; }
    .auth-error { color: #ff6b6b; font-size: 0.9rem; margin-bottom: 15px; display: none; background: rgba(255, 107, 107, 0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(255, 107, 107, 0.3); }
  </style>
</head>
<body>
  <!-- HEADER -->
  <nav>
    <a href="../index.html" class="logo">Noor Al-Quran<span>نور القرآن</span></a>
    <ul class="nav-links">
      <li><a href="quran.html" data-i18n="nav_quran">Quran</a></li>
      <li><a href="reciters.html" data-i18n="nav_reciters">Reciters</a></li>
      <li><a href="prayer.html" data-i18n="nav_prayer">Prayer Times</a></li>
      <li class="dropdown">
        <a href="javascript:void(0)" style="cursor:default" data-i18n="nav_tools">Tools ▾</a>
        <div class="dropdown-content">
          <a href="dua.html" data-i18n="nav_dua">Daily Dua</a>
          <a href="tasbih.html" data-i18n="nav_tasbih">Tasbih Counter</a>
          <a href="qibla.html" data-i18n="nav_qibla">Qibla Compass</a>
          <a href="hijri.html" data-i18n="nav_hijri">Hijri Calendar</a>
          <a href="hadith.html" data-i18n="nav_hadith">Hadith</a>
        </div>
      </li>
      <li><a href="names.html" data-i18n="nav_names">99 Names</a></li>
    </ul>
  </nav>

  <!-- CONTENT -->
  <div class="auth-container">
    <div class="auth-title" data-i18n="auth_register_title">Join Noor Al-Quran</div>
    <div class="auth-sub" data-i18n="auth_register_sub">Create an account to save bookmarks</div>
    
    <div id="register-error" class="auth-error"></div>

    <form class="auth-form" id="registerForm">
      <input type="text" id="username" class="auth-input" placeholder="Choose a username" required minlength="3">
      <input type="password" id="password" class="auth-input" placeholder="Create a password" required minlength="6">
      <button type="submit" class="auth-btn" id="registerBtn" data-i18n="auth_register_btn">Create Account</button>
    </form>

    <div class="auth-links">
      <span data-i18n="auth_have_account">Already have an account?</span> <a href="login.html" data-i18n="auth_login_link">Log in here</a>
    </div>
  </div>

  <!-- MOBILE NAV -->
  <div class="mob-nav">
    <a href="../index.html">
      <div class="mn-ic">🏠</div>
      <div data-i18n="mn_home">Home</div>
    </a>
    <a href="quran.html">
      <div class="mn-ic">📖</div>
      <div data-i18n="mn_quran">Quran</div>
    </a>
    <a href="reciters.html">
      <div class="mn-ic">🎙️</div>
      <div data-i18n="mn_reciters">Audio</div>
    </a>
    <a href="prayer.html">
      <div class="mn-ic">🕐</div>
      <div data-i18n="mn_prayer">Prayer</div>
    </a>
    <a href="bookmarks.html" class="active" id="mn-saved">
      <div class="mn-ic">👤</div>
      <div data-i18n="mn_profile">Profile</div>
    </a>
  </div>

  <script src="../shared.js?v=5"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect
      if(localStorage.getItem('access_token')) {
        window.location.href = 'bookmarks.html';
      }

      document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        const errDiv = document.getElementById('register-error');
        const btn = document.getElementById('registerBtn');

        if (!u || !p) return;

        btn.disabled = true;
        btn.textContent = 'Creating...';
        errDiv.style.display = 'none';

        try {
          const res = await fetch(`${API_BASE}/auth/register/`, {
            method: 'POST', 
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: u, password: p})
          });
          
          const data = await res.json();
          
          if (res.ok && data.access) {
            localStorage.setItem('access_token', data.access);
            localStorage.setItem('refresh_token', data.refresh);
            localStorage.setItem('username', u);
            window.location.href = 'bookmarks.html';
          } else {
            // DRF usually returns errors as objects
            let errorMsg = 'Registration failed. Username might be taken.';
            if (data.username) errorMsg = `Username: ${data.username[0]}`;
            else if (data.password) errorMsg = `Password: ${data.password[0]}`;
            else if (data.detail) errorMsg = data.detail;

            errDiv.textContent = errorMsg;
            errDiv.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Create Account';
          }
        } catch (err) {
          errDiv.textContent = 'Network error. Please try again.';
          errDiv.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Create Account';
        }
      });
    });
  </script>
<script src="../i18n.js"></script>
</body>
</html>
