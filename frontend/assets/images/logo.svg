<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e197"/>
      <stop offset="45%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#9a7009"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1b38"/>
      <stop offset="80%" stop-color="#030919"/>
      <stop offset="100%" stop-color="#020818"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="rgba(212,160,23,0.3)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Crescent Moon -->
  <path d="M 320,105 C 230,105 160,175 160,265 C 160,355 230,425 320,425 C 348,425 374,418 396,405 C 330,390 280,332 280,265 C 280,198 330,140 396,125 C 374,112 348,105 320,105 Z" 
        fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Star -->
  <polygon points="340,195 349,218 373,218 354,233 361,256 340,242 319,256 326,233 307,218 331,218" 
           fill="url(#goldGrad)"/>

  <!-- Open Quran Book Stylized at base -->
  <g transform="translate(256, 360)">
    <!-- Left page -->
    <path d="M -90,-25 C -55,-35 -15,-30 0,-15 L 0,25 C -15,10 -55,5 -90,15 Z" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Right page -->
    <path d="M 90,-25 C 55,-35 15,-30 0,-15 L 0,25 C 15,10 55,5 90,15 Z" fill="#ffffff" fill-opacity="0.9"/>
    <!-- Center spine & stand -->
    <path d="M -4,-18 L 4,-18 L 4,32 L -4,32 Z" fill="url(#goldGrad)"/>
    <path d="M -45,35 L 45,35 L 0,20 Z" fill="url(#goldGrad)"/>
  </g>
</svg>